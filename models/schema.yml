version: 2

seeds:
  - name: items
    description: Паспорт изделия — линия, тип, дата запуска, площадка.
    columns:
      - name: item_id
        tests: [not_null, unique]
      - name: start_date
        tests: [not_null]
  - name: measurements
    description: Измерения массы по возрасту процесса.
    columns:
      - name: item_id
        tests: [not_null]
      - name: event_date
        tests: [not_null]
      - name: mass
        tests: [not_null]
    config:
      column_types:
        event_date: date
        mass: float8
        age_days: integer
  - name: lab_passports
    description: Паспорт изделия с основным и запасными идентификаторами.
    config:
      column_types:
        item_id: varchar
        item_type: integer
        start_date: date
        id_main: varchar
        id_2: varchar
        id_3: varchar
        id_alt_1: varchar
        id_alt_2: varchar
        id_alt_3: varchar
        id_alt_4: varchar
        id_extra_1: varchar
        id_extra_2: varchar
        id_extra_3: varchar
        id_extra_4: varchar
        id_extra_5: varchar
        id_extra_6: varchar
        id_extra_7: varchar
        id_extra_8: varchar
        id_extra_9: varchar
  - name: lab_ids
    description: Лабораторные ID и дополнительные номера образца.
    config:
      column_types:
        lab_id: varchar
        lab_id_add_1: varchar
        lab_id_add_2: varchar
        lab_id_add_3: varchar
        item_type: integer
        lab_date: date

models:
  - name: 01_qc_kept
    description: Измерения внутри возрастного IQR (скрипт 1, возраст = дата события − дата запуска).
    columns:
      - name: item_id
        tests: [not_null]
      - name: mass
        tests: [not_null]
  - name: 01_qc_outliers
    description: Отбраковка скрипта 1 — вне IQR или прирост вне [-3, 3].
    columns:
      - name: item_id
        tests: [not_null]
  - name: 02_qc_kept
    description: Измерения внутри недельного IQR (скрипт 2, возраст из колонки, бин / 7).
    columns:
      - name: item_id
        tests: [not_null]
      - name: mass
        tests: [not_null]
  - name: 02_qc_outliers
    description: Отбраковка скрипта 2 — группы линия × площадка, как в исходной outliers-функции.
    columns:
      - name: item_id
        tests: [not_null]
